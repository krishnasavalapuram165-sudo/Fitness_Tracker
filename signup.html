<!DOCTYPE html>
<html>
<head>
    <title>Fitness Tracker - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="left-side">

        <h1>JOIN<br>FITNESS<br>TRACKER</h1>

        <p>
            Start your fitness journey today.<br>
            Track. Improve. Achieve.
        </p>

        <div class="side-quote">
            "Your future self will thank you."
        </div>

    </div>


    <div class="right-side">

        <div class="login-box">

            <h2>Create Account</h2>

            <p>Create your Fitness Tracker account</p>

            <input type="text" id="newUsername" placeholder="Choose Username">

            <input type="password" id="newPassword" placeholder="Choose Password">

            <input type="password" id="confirmPassword" placeholder="Confirm Password">

            <button onclick="signup()">Create Account</button>

            <p id="signupMessage"></p>

            <p class="signup-text">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
